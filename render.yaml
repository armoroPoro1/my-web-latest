services:
  - type: web
    name: sales-order-system
    runtime: php
    plan: free
    region: singapore # หรือ oregon / frankfurt
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      npm install
      npm run build
    startCommand: |
      touch database/database.sqlite
      php artisan migrate:fresh --seed --force
      php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: "ระบบจัดการการขายและใบสั่งซื้อ"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: array
      - key: QUEUE_CONNECTION
        value: sync
